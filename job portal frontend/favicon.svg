    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF92A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDBF2D;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Briefcase body -->
  <rect x="12" y="26" width="40" height="26" rx="4" fill="#06124A"/>
